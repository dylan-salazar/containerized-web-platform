version: '3.8'

services:
  node-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: node-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - app-network

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - node-app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
